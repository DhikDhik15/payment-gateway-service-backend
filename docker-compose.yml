services:

  # ── Application ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pay-gate-app
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      APP_NAME: payment-gateway
      APP_ENV: development
      APP_PORT: "8080"
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-payment_gateway}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      WEBHOOK_DELIVERY_ENABLED: "true"
      WEBHOOK_REQUIRE_HTTPS: "false"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SETTLEMENT_RECON_STALE_AFTER: ${SETTLEMENT_RECON_STALE_AFTER:-2m}
      WEBHOOK_SECRET_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      # Phase 8 — dashboard auth (never commit real secrets; pass via host .env)
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-15m}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-168h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pay-gate-net

  # ── Migration runner (one-shot) ──────────────────────────────────────────────
  migrate:
    image: migrate/migrate:v4.18.1
    container_name: pay-gate-migrate
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/${DB_NAME:-payment_gateway}?sslmode=${DB_SSLMODE:-disable}"
      - "up"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pay-gate-net

networks:
  pay-gate-net:
    name: pay-gate-network
    driver: bridge
