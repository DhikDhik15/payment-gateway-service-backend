openapi: 3.1.0
info:
  title: Payment Gateway — Merchant and Dashboard API
  description: |
    Merchant API for payments, refunds and webhooks, plus dashboard order creation and retrieval.

    ## Authentication

    Integration endpoints require the `X-API-Key` header (compound format:
    `pk_<hex>:sk_<hex>`). Dashboard order endpoints require a dashboard JWT in
    `Authorization: Bearer <access-token>`; merchant API keys do not authorize them.
    Merchant identity is derived from the authenticated credential, never from a
    client-supplied `merchant_id`. Orders belonging to another merchant return 404.
    Dashboard OWNER and ADMIN users can create orders; VIEWER users can read orders only.

    ## Idempotency

    Payment and refund creation require an `Idempotency-Key` (1–255 chars), scoped
    to the merchant. The same key and payload replay the stored result; a changed
    payload returns `409 IDEMPOTENCY_KEY_REUSED`.

    Dashboard order creation also requires an `Idempotency-Key`, but accepts only
    1–255 printable ASCII characters without whitespace. Order keys are durable
    (not subject to the payment/refund idempotency TTL) and scoped to the merchant.
    An identical set of product IDs and quantities, regardless of item order,
    replays the original immutable price snapshot with HTTP 200; a different
    request using the same key returns `409 IDEMPOTENCY_KEY_REUSED`. A concurrent
    request for the same merchant/key is serialized; it does not create a second
    order. Use a fresh key for a new order, even if the items are identical.

    ## Rate Limiting

    - Integration API: 120 requests/minute per authenticated merchant
    - Integration API: 120 requests/minute per client IP (pre-auth)
    - 429 returned when exceeded, with `Retry-After` header
  version: 1.0.0
  contact:
    name: Payment Gateway Support
servers:
  - url: http://localhost:8080
    description: Development
  - url: https://api.example.com
    description: Production
tags:
  - name: Payments
    description: Payment lifecycle operations
  - name: Refunds
    description: Refund operations
  - name: Webhooks
    description: Merchant webhook configuration and delivery inspection
  - name: Dashboard Orders
    description: JWT-authenticated, merchant-scoped POS orders (not payments)
  - name: Dashboard Products
    description: JWT-authenticated, merchant-scoped product catalog
  - name: Dashboard Categories
    description: JWT-authenticated, merchant-scoped product categories
  - name: Dashboard Auth
    description: Public dashboard authentication flows (forgot-password)
paths:
  /api/v1/auth/password-reset/request:
    post:
      tags: [Dashboard Auth]
      summary: Request a password reset
      description: |
        Sends a single-use password-reset email when the address belongs to an
        eligible (ACTIVE user, ACTIVE merchant) account. Always returns the same
        generic response so account existence is never revealed.

        - Reset tokens are opaque 256-bit values; only the SHA-256 hash is stored.
        - Tokens expire after PASSWORD_RESET_TOKEN_TTL (default 1h) and are single-use.
        - Rate limited per client IP and per submitted account email.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordResetRequest'
      responses:
        '200':
          description: Generic response (identical for known and unknown emails)
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/RequestPasswordResetResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Rate limit exceeded (Retry-After header present)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Dashboard Auth]
      summary: Reset the password with a reset token
      description: |
        Consumes a single-use reset token and sets a new password (8–128
        characters). The claim, password update, revocation of other reset
        tokens, and deletion of the user's refresh sessions commit atomically;
        concurrent consumes serialize to exactly one winner. Does not establish
        a session — sign in with the new password afterwards. Rate limited per
        client IP.
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordResetRequest'
      responses:
        '200':
          description: Password reset; no session is established
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/ConfirmPasswordResetResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Reset token already consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Reset token expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (Retry-After header present)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/dev-recovery/status:
    get:
      tags: [Dashboard Auth]
      summary: Development recovery capability
      description: |
        Reports whether development-only account recovery is enabled. Public
        capability signal for the dashboard (no secrets). Always safe to call.
      operationId: devRecoveryStatus
      responses:
        '200':
          description: Capability signal (no secrets)
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/DevRecoveryStatusResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
  /api/v1/auth/dev-recovery/recover:
    post:
      tags: [Dashboard Auth]
      summary: Recover an account password (development only)
      description: |
        Development-only password recovery without SMTP delivery. Disabled by
        default; 404 unless explicitly enabled with APP_ENV=development,
        DEV_RECOVERY_ENABLED=true, DEV_RECOVERY_KEY, and APP_BIND_HOST=127.0.0.1.
        Rejected at startup in production. Requires the X-Dev-Recovery-Key
        header (never a body/URL field); an email address alone is never
        sufficient. Updates only the identified account and revokes its refresh
        sessions. Rate limited per client IP and per submitted account email.
      operationId: devRecoveryRecover
      parameters:
        - in: header
          name: X-Dev-Recovery-Key
          required: true
          schema:
            type: string
          description: Development recovery key (per-request header only; never in body, URL, or storage).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevRecoveryRequest'
      responses:
        '200':
          description: Password updated; sign in with the new password (no session established)
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/DevRecoveryResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing/wrong recovery key (reveals nothing about accounts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Feature disabled, or authorized but unknown/ineligible account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (Retry-After header present)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/payments:
    get:
      tags: [Payments]
      summary: List payments
      description: |
        Returns a paginated, filtered list of transactions for the authenticated merchant.
        Results are always scoped to the merchant derived from the X-API-Key.
      operationId: listPayments
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/MerchantOrderIdFilter'
        - $ref: '#/components/parameters/PaymentMethodFilter'
        - $ref: '#/components/parameters/CreatedFromParam'
        - $ref: '#/components/parameters/CreatedToParam'
      responses:
        '200':
          $ref: '#/components/responses/PaymentListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Payments]
      summary: Create a payment
      description: |
        Initiates a new payment for the authenticated merchant.

        **Idempotency:** `Idempotency-Key` (1–255 chars, required) scopes the request to the
        authenticated merchant. The key and the request body are hashed together; the hash is
        compared on every replay.

        - Same key + same payload → replays stored result (201)
        - Same key + different payload → 409 IDEMPOTENCY_KEY_REUSED
        - Concurrent same key → 409 IDEMPOTENCY_REQUEST_IN_PROGRESS
        - Provider timeout stored as FAILED; replay returns same 504
        - Records expire after IDEMPOTENCY_TTL (default 24h)
      operationId: createPayment
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              default:
                value:
                  merchant_order_id: ORDER-2026-0001
                  amount: 150000
                  currency: IDR
                  payment_method: QRIS
      responses:
        '201':
          $ref: '#/components/responses/PaymentCreatedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/payments/{id}:
    get:
      tags: [Payments]
      summary: Get a payment
      description: |
        Returns the payment details. The transaction must belong to the authenticated merchant.
        A payment belonging to another merchant is reported as 404 (no existence leak).
      operationId: getPayment
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentIdParam'
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/payments/{id}/cancel:
    post:
      tags: [Payments]
      summary: Cancel a payment
      description: |
        Cancels a CREATED or PENDING transaction. PAID, FAILED, EXPIRED, and CANCELLED
        transactions cannot be cancelled.
      operationId: cancelPayment
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentIdParam'
      responses:
        '200':
          description: Payment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/payments/{id}/refunds:
    post:
      tags: [Refunds]
      summary: Create a refund
      description: |
        Creates a partial or full refund against a PAID payment transaction.

        **Over-refund protection:** Both PENDING and PROCESSING refunds count against the
        refundable balance, preventing double-spend. Maximum total refundable = transaction amount.
        Partial refunds supported. Provider timeout → refund stays PENDING with reservation held.

        Idempotency behavior matches payment creation.
      operationId: createRefund
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
            examples:
              partial:
                value:
                  amount: 50000
                  currency: IDR
                  reason: Customer request
      responses:
        '201':
          $ref: '#/components/responses/RefundCreatedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Refunds]
      summary: List refunds for a payment
      description: Returns a paginated list of refunds for a specific PAID payment.
      operationId: listRefunds
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/RefundStatusFilter'
      responses:
        '200':
          description: Refund list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Refund'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/refunds/{id}:
    get:
      tags: [Refunds]
      summary: Get a refund
      description: |
        Returns the refund details. The refund must belong to the authenticated merchant.
        Returns 404 for both non-existent refund IDs and refunds belonging to another merchant.
      operationId: getRefund
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/RefundIdParam'
      responses:
        '200':
          description: Refund found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/merchants/{merchantId}/api-keys:
    post:
      tags: [Webhooks]
      summary: Create an API key
      description: |
        Creates a new named API key for the specified merchant. The plaintext secret is returned
        **only on creation** — it cannot be retrieved again. Store it securely.

        The authenticated merchant (X-API-Key) must match path `{merchantId}`.
      operationId: createApiKey
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/MerchantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
            examples:
              default:
                value:
                  name: Production Key
      responses:
        '201':
          description: API key created; secret returned once only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    get:
      tags: [Webhooks]
      summary: List API keys
      description: Returns all API keys for the specified merchant. Never includes secret or secret_hash.
      operationId: listApiKeys
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/MerchantIdParam'
      responses:
        '200':
          description: API key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/merchants/{merchantId}/api-keys/{keyId}:
    delete:
      tags: [Webhooks]
      summary: Revoke an API key
      description: |
        Revokes an API key. The key immediately becomes unusable for authentication.
        Revocation is permanent (soft delete — record preserved with status REVOKED).
      operationId: revokeApiKey
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/MerchantIdParam'
        - $ref: '#/components/parameters/ApiKeyIdParam'
      responses:
        '200':
          description: Key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: API key revoked
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    post:
      tags: [Webhooks]
      summary: Rotate an API key
      description: |
        Atomically revokes the existing key and creates a replacement. The plaintext secret of
        the new key is returned **only on rotation**. The old key is immediately revoked.
      operationId: rotateApiKey
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/MerchantIdParam'
        - $ref: '#/components/parameters/ApiKeyIdParam'
      responses:
        '201':
          description: New key created; secret returned once only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateApiKeyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /api/v1/merchants/{merchantId}/webhook:
    post:
      tags: [Webhooks]
      summary: Configure merchant webhook
      description: |
        Creates or replaces the merchant's outbound webhook endpoint. Returns the plaintext
        signing secret **once**. Store it securely. One active endpoint per merchant.
        Secret is AES-256-GCM encrypted at rest.
      operationId: upsertWebhook
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/MerchantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertWebhookRequest'
            examples:
              default:
                value:
                  url: https://merchant.example.com/webhook
                  description: Production webhook
      responses:
        '201':
          description: Webhook configured; secret returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfigWithSecret'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    get:
      tags: [Webhooks]
      summary: Get webhook config
      description: Returns the webhook configuration. Never includes the signing secret.
      operationId: getWebhook
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/MerchantIdParam'
      responses:
        '200':
          description: Webhook config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfig'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Webhooks]
      summary: Disable webhook
      description: Soft-disables the webhook (ACTIVE → DISABLED). Historical deliveries remain.
      operationId: disableWebhook
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/MerchantIdParam'
      responses:
        '200':
          description: Webhook disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfig'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/merchants/{merchantId}/webhook/rotate:
    post:
      tags: [Webhooks]
      summary: Rotate webhook signing secret
      description: Generates a new signing secret. Old secret stops being used immediately.
      operationId: rotateWebhookSecret
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/MerchantIdParam'
      responses:
        '200':
          description: Secret rotated; new secret returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfigWithSecret'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/merchants/{merchantId}/webhook/deliveries:
    get:
      tags: [Webhooks]
      summary: List webhook deliveries
      description: Lists outbound webhook delivery attempts for the merchant (audit / outbox).
      operationId: listDeliveries
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/MerchantIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Delivery list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/merchants/{merchantId}/webhook/deliveries/{deliveryId}/retry:
    post:
      tags: [Webhooks]
      summary: Retry a webhook delivery
      description: Re-queues FAILED, DEAD, or PENDING deliveries for immediate attempt.
      operationId: retryDelivery
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/MerchantIdParam'
        - $ref: '#/components/parameters/DeliveryIdParam'
      responses:
        '200':
          description: Delivery queued for retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /api/v1/dashboard/orders:
    post:
      tags: [Dashboard Orders]
      summary: Create an order from product snapshots
      description: |
        Requires a dashboard Bearer JWT with OWNER or ADMIN role (VIEWER gets 403).
        The merchant is derived from the authenticated dashboard user, not the body.
        Supply only product IDs and quantities; unknown fields, duplicate product IDs,
        inactive or other merchants' products are rejected. Product name, unit price
        and currency are read from the merchant's active catalog and saved as immutable
        snapshots. All products must use the same currency. Subtotal and total_amount
        are integer minor units; total_amount equals subtotal (no tax, discounts, fees
        or currency conversion). This creates an order only, not a payment.

        **Durable idempotency:** The required merchant-scoped Idempotency-Key is
        1–255 printable ASCII characters without whitespace. Requests with the same
        key and equivalent item sets (item order ignored) return the original order
        and its original snapshots with HTTP 200. A different item set returns
        409 IDEMPOTENCY_KEY_REUSED. Concurrent same-key requests serialize. Order
        keys do not expire with the payment/refund idempotency TTL.
      operationId: createDashboardOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              items:
                - product_id: 5fcaf6af-ea8f-4328-866e-168d07e7c9a0
                  quantity: 2
      responses:
        '201':
          $ref: '#/components/responses/OrderCreatedResponse'
        '200':
          $ref: '#/components/responses/OrderReplayedResponse'
        '400':
          $ref: '#/components/responses/OrderCreateError'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '403':
          $ref: '#/components/responses/DashboardRoleError'
        '409':
          $ref: '#/components/responses/OrderIdempotencyConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Dashboard Orders]
      summary: List orders
      description: |
        Lists orders owned by the authenticated merchant, newest first by
        created_at DESC, id DESC. All dashboard roles can read. Each order
        includes its saved item snapshots, even if the product was later deleted.
      operationId: listDashboardOrders
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          $ref: '#/components/responses/OrderListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/dashboard/orders/{order_id}:
    get:
      tags: [Dashboard Orders]
      summary: Get an order
      description: |
        Returns an order and its immutable item snapshots. All dashboard roles
        can read. Missing and cross-merchant order IDs both return 404.
      operationId: getDashboardOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      responses:
        '200':
          $ref: '#/components/responses/OrderDetailResponse'
        '400':
          description: Invalid order UUID (INVALID_REQUEST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '404':
          $ref: '#/components/responses/OrderNotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/dashboard/orders/{order_id}/payments:
    get:
      tags: [Dashboard Orders]
      summary: List payment attempts for an existing order
      description: |
        Requires a dashboard Bearer JWT (all roles may read). The order must
        belong to the authenticated merchant — missing and foreign order IDs
        both return 404. Returns the recorded payment attempts newest first
        (created_at DESC, id DESC) as PaymentResponse items, each carrying its
        transaction_id, order_id, status, method, server-derived amount and
        currency, and timestamps. Order-backed attempts additionally carry an
        order_summary (first product names plus line count, from immutable
        order-item snapshots) for display; it is omitted when unavailable.
        Strictly read-only: it never creates,
        mutates, reconciles, simulates, or cancels anything, so it is safe to
        poll for recovery. An empty array means no attempt exists yet.
      operationId: listDashboardOrderPayments
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      responses:
        '200':
          description: Payment attempts, newest first (empty array when none)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '404':
          $ref: '#/components/responses/OrderNotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Dashboard Orders]
      summary: Initiate a payment for an existing order
      description: |
        Requires a dashboard Bearer JWT with OWNER or ADMIN role (VIEWER gets 403).
        Amount, currency, merchant identity and merchant_order_id are derived
        server-side from the authenticated order — the body accepts only
        payment_method, and unknown fields are rejected. The order must belong
        to the authenticated merchant (otherwise 404) and be in CREATED status.

        **Idempotency:** the merchant-scoped Idempotency-Key is required. Same
        order + same payment method + same key replays the original result
        (201 with the original transaction); the same key with a different
        payment method returns 409 IDEMPOTENCY_KEY_REUSED. Keys expire with the
        payment idempotency TTL (24h).

        **Retry policy:** one order may have many attempts over its lifetime,
        but at most one active (CREATED/PENDING) and at most one PAID payment
        (enforced by partial unique indexes). A new attempt is allowed after
        FAILED/CANCELLED/EXPIRED and rejected (409) while an attempt is active
        or already PAID.

        **Ambiguous provider outcome:** a provider timeout that cannot be
        reconciled via provider lookup leaves the transaction CREATED and
        returns 504 without starting another attempt; retry only after the
        outcome resolves. A definitive provider failure marks the transaction
        FAILED (201→FAILED is a valid CREATED transition) and a retry is allowed.

        Merchant webhooks keep their existing shape and semantics (no order_id
        is added to the outbound payload — backward compatible); the order link
        remains available to internal persistence via transactions.order_id.
      operationId: createDashboardOrderPayment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderPaymentRequest'
            example:
              payment_method: QRIS
      responses:
        '201':
          description: Order payment initiated (CreatePaymentResponse, includes order_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '403':
          $ref: '#/components/responses/DashboardRoleError'
        '404':
          $ref: '#/components/responses/OrderNotFoundError'
        '409':
          description: Order not payable, duplicate active/paid payment, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Definitive provider failure (payment recorded as FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Ambiguous provider outcome (transaction stays CREATED, do not blindly retry creation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/dashboard/categories:
    post:
      tags: [Dashboard Categories]
      summary: Create a category
      description: |
        Requires a dashboard Bearer JWT with OWNER or ADMIN role (VIEWER gets 403).
        The merchant is derived from the authenticated dashboard user, not the body.
        Names are trimmed and must be non-blank (max 100 chars); duplicates are
        rejected case-insensitively per merchant with 409.
      operationId: createDashboardCategory
