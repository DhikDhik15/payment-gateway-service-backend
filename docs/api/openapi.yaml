  /api/v1/dashboard/products:
    post:
      tags: [Dashboard Products]
      summary: Create a product
      description: |
        Requires a dashboard Bearer JWT with OWNER or ADMIN role (VIEWER gets 403).
        The merchant is derived from the authenticated dashboard user, not the body.
        Price is integer minor units (≥0); currency must be IDR; an optional
        category must belong to the same merchant; an optional image_url must be
        either an HTTPS URL (the backend never fetches it) or a backend-stored
        reference issued by POST /api/v1/dashboard/product-images. Duplicate SKUs conflict.
      operationId: createDashboardProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            example:
              name: Arabica 250g
              price: 85000
              currency: IDR
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '403':
          $ref: '#/components/responses/DashboardRoleError'
        '404':
          $ref: '#/components/responses/ProductCategoryNotFoundError'
        '409':
          $ref: '#/components/responses/ProductConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Dashboard Products]
      summary: List products
      description: |
        Lists products owned by the authenticated merchant with optional
        category, active-status, and free-text filters, paginated newest-active
        first (active DESC, updated_at DESC, name ASC, id DESC). All dashboard
        roles can read.
      operationId: listDashboardProducts
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryIdQueryParam'
        - $ref: '#/components/parameters/ActiveQueryParam'
        - $ref: '#/components/parameters/ProductSearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          $ref: '#/components/responses/ProductListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/dashboard/products/{product_id}:
    get:
      tags: [Dashboard Products]
      summary: Get a product
      description: |
        Returns one product owned by the authenticated merchant. Missing and
        cross-merchant IDs both return 404.
      operationId: getDashboardProduct
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductIdParam'
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '404':
          $ref: '#/components/responses/ProductNotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Dashboard Products]
      summary: Update a product
      description: |
        Requires OWNER or ADMIN role. Only provided fields are updated; blank
        names, negative prices, non-IDR currency, and invalid image URLs are
        rejected with 400. Accepts HTTPS URLs and backend-stored upload
        references; PATCH cannot clear an image (use
        DELETE /api/v1/dashboard/products/{product_id}/image).
        Existing orders keep their immutable snapshots:
        price edits never rewrite order history.
      operationId: updateDashboardProduct
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '403':
          $ref: '#/components/responses/DashboardRoleError'
        '404':
          $ref: '#/components/responses/ProductNotFoundError'
        '409':
          $ref: '#/components/responses/ProductConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Dashboard Products]
      summary: Delete a product
      description: |
        Requires OWNER or ADMIN role. Hard delete; existing order item
        snapshots are preserved with a nulled product link.
      operationId: deleteDashboardProduct
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductIdParam'
      responses:
        '200':
          description: Deletion acknowledgement
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        example: deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '403':
          $ref: '#/components/responses/DashboardRoleError'
        '404':
          $ref: '#/components/responses/ProductNotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/dashboard/product-images:
    post:
      tags: [Dashboard Products]
      summary: Upload a product image
      description: |
        Requires a dashboard Bearer JWT with OWNER or ADMIN role (VIEWER gets 403).
        Accepts multipart/form-data with a single `image` field (JPEG, PNG, or
        WebP; GIF, BMP, and SVG/HTML are rejected). The file is validated by
        actual decoding (not filename or Content-Type), bounded by
        PRODUCT_IMAGE_MAX_BYTES / MAX_DIMENSION / MAX_PIXELS, stored under a
        server-generated UUID filename, and returns a stable `image_url`
        reference for use in product create/PATCH payloads. The upload alone
        never modifies any product. The merchant is derived from the
        authenticated dashboard user, never from the body.
        NOTE: the global HTTP_MAX_BODY_BYTES limit applies before this handler
        runs — it must be configured above PRODUCT_IMAGE_MAX_BYTES.
      operationId: uploadDashboardProductImage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP image file.
      responses:
        '201':
          description: Image uploaded; stable reference returned
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProductImageUpload'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '403':
          $ref: '#/components/responses/DashboardRoleError'
        '413':
          $ref: '#/components/responses/ProductImageTooLargeError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/dashboard/products/{product_id}/image:
    delete:
      tags: [Dashboard Products]
      summary: Remove a product image
      description: |
        Requires OWNER or ADMIN role. Clears the product's image reference
        (sets image_url to null) and deletes the backing file when it is a
        backend-stored reference no longer used by any product. External
        HTTPS references are unlinked without file operations. Missing
        products, foreign products, and products with no image all return 404.
      operationId: deleteDashboardProductImage
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductIdParam'
      responses:
        '200':
          description: Product with cleared image
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '403':
          $ref: '#/components/responses/DashboardRoleError'
        '404':
          $ref: '#/components/responses/ProductNotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/product-images/{merchant_id}/{filename}:
    get:
      tags: [Dashboard Products]
      summary: Serve a product image
      description: |
        Public (no authentication — product images are public catalog assets,
        equivalent to the external HTTPS image_url values they replace).
        References are server-generated UUID paths. Serves image/jpeg,
        image/png, or image/webp with `Cache-Control: public, max-age=86400, immutable` and
        `X-Content-Type-Options: nosniff`. Unknown or malformed references
        return a bare 404 with no storage detail. Clients resolve stored
        `image_url` values against the backend API origin.
      operationId: getProductImage
      parameters:
        - name: merchant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: filename
          in: path
          required: true
          schema:
            type: string
            example: 3fa85f64-5717-4562-b3fc-2c963f66afa6.png
      responses:
        '200':
          description: Image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Unknown or malformed image reference
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Merchant API key. Compound format: `pk_<hex>:sk_<hex>`.
        The API key determines the merchant identity — never send a merchant_id.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Dashboard access token in Authorization: Bearer <access-token>.
        X-API-Key is not accepted for dashboard order routes. The authenticated
        dashboard user determines the merchant scope.
  parameters:
    OrderIdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Durable merchant-scoped order creation key, 1–255 printable ASCII
        characters without whitespace. Same key and equivalent items replay the
        original order (200); changed items return 409 IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[!-~]{1,255}$'
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Merchant-scoped idempotency key (1–255 chars). Required for POST /payments and POST /refunds.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    OrderIdParam:
      name: order_id
      in: path
      required: true
      description: Order UUID
      schema:
        type: string
        format: uuid
    CategoryIdParam:
      name: category_id
      in: path
      required: true
      description: Category UUID
      schema:
        type: string
        format: uuid
    ProductIdParam:
      name: product_id
      in: path
      required: true
      description: Product UUID
      schema:
        type: string
        format: uuid
    CategoryIdQueryParam:
      name: category_id
      in: query
      required: false
      description: Filter products by category UUID
      schema:
        type: string
        format: uuid
    ActiveQueryParam:
      name: active
      in: query
      required: false
      description: Filter products by active status
      schema:
        type: boolean
    ProductSearchParam:
      name: search
      in: query
      required: false
      description: Free-text match against product name, SKU, or description
      schema:
        type: string
    PaymentIdParam:
      name: id
      in: path
      required: true
      description: Transaction UUID
      schema:
        type: string
        format: uuid
    RefundIdParam:
      name: id
      in: path
      required: true
      description: Refund UUID
      schema:
        type: string
        format: uuid
    MerchantIdParam:
      name: merchantId
      in: path
      required: true
      description: Merchant UUID
      schema:
        type: string
        format: uuid
    ApiKeyIdParam:
      name: keyId
      in: path
      required: true
      description: API key UUID
      schema:
        type: string
        format: uuid
    DeliveryIdParam:
      name: deliveryId
      in: path
      required: true
      description: Delivery UUID
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      description: Page number (default 1, min 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Items per page (default 20, min 1, max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StatusFilter:
      name: status
      in: query
      required: false
      description: Filter by payment status
      schema:
        type: string
        enum: [CREATED, PENDING, PAID, FAILED, EXPIRED, CANCELLED]
    RefundStatusFilter:
      name: status
      in: query
      required: false
      description: Filter by refund status
      schema:
        type: string
        enum: [PENDING, PROCESSING, SUCCEEDED, FAILED]
    MerchantOrderIdFilter:
      name: merchant_order_id
      in: query
      required: false
      description: Filter by exact merchant_order_id
      schema:
        type: string
    PaymentMethodFilter:
      name: payment_method
      in: query
      required: false
      description: Filter by payment method
      schema:
        type: string
        enum: [QRIS]
    CreatedFromParam:
      name: created_from
      in: query
      required: false
      description: Lower bound on created_at, RFC3339 (inclusive)
      schema:
        type: string
        format: date-time
    CreatedToParam:
      name: created_to
      in: query
      required: false
      description: Upper bound on created_at, RFC3339 (exclusive)
      schema:
        type: string
        format: date-time
  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [items]
      description: |
        Select 1–100 distinct merchant products. Do not send merchant_id, prices,
        currency or product names; all are resolved server-side. Item order does
        not affect the idempotency hash.
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CreateOrderItemRequest'
    CreateOrderItemRequest:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
          description: Active product belonging to the authenticated merchant; each ID may occur only once per order.
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
    OrderStatus:
      type: string
      enum: [CREATED]
      description: Orders have only the CREATED state; payments have a separate lifecycle.
    CreateOrderPaymentRequest:
      type: object
      additionalProperties: false
      required: [payment_method]
      description: |
        Only the payment method is client input. Amount, currency, merchant
        identity and merchant_order_id are derived server-side from the
        authenticated order. Unknown fields are rejected.
      properties:
        payment_method:
          type: string
          enum: [QRIS]
          description: Payment method (QRIS is currently the only supported value)
    OrderItem:
      type: object
      required: [id, order_id, merchant_id, product_id, product_name, quantity, unit_price, subtotal, created_at]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        product_id:
          type: [string, 'null']
          format: uuid
          description: Null if the source product was subsequently deleted; the price/name snapshots remain.
        product_name:
          type: string
          description: Name captured at order creation.
        quantity:
          type: integer
          format: int64
        unit_price:
          type: integer
          format: int64
          description: Product price at order creation in integer minor units.
        subtotal:
          type: integer
          format: int64
          description: unit_price multiplied by quantity.
        created_at:
          type: string
          format: date-time
    Order:
      type: object
      required: [id, merchant_id, status, currency, subtotal, total_amount, items, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
          description: Derived from the authenticated dashboard user, never client input.
        status:
          $ref: '#/components/schemas/OrderStatus'
        currency:
          type: string
          description: Shared currency of the selected products.
        subtotal:
          type: integer
          format: int64
          description: Sum of item subtotals in integer minor units.
        total_amount:
          type: integer
          format: int64
          description: Equals subtotal; no taxes, discounts, fees or FX.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Category:
      type: object
      required: [id, merchant_id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
          description: Derived from the authenticated dashboard user, never client input.
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
    Product:
      type: object
      required: [id, merchant_id, name, price, currency, active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
          description: Derived from the authenticated dashboard user, never client input.
        category_id:
          type: string
          format: uuid
          nullable: true
          description: Null when uncategorized or when the source category was deleted.
        name:
          type: string
          maxLength: 200
        sku:
          type: string
          maxLength: 50
          nullable: true
        description:
          type: string
          maxLength: 500
          nullable: true
        price:
          type: integer
          format: int64
          minimum: 0
          description: 'Integer minor units (IDR: rupiah). Never floats.'
        currency:
          type: string
          enum: [IDR]
        image_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: Optional image reference for storefront display. Either an external absolute HTTPS URL (syntactic validation only — the backend never fetches it) or a backend-stored reference (/api/v1/product-images/<merchant>/<file>) issued by POST /api/v1/dashboard/product-images. Resolve stored references against the backend API origin.
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductImageUpload:
      type: object
      required: [image_url, format, width, height, size_bytes, content_type]
      properties:
        image_url:
          type: string
          example: /api/v1/product-images/3fa85f64-5717-4562-b3fc-2c963f66afa6/7c9e6679-7425-40de-944b-e07fc1f90ae7.png
          description: Stable reference to store in product image_url (create/PATCH). Relative to the backend API origin; no filesystem path is exposed.
        format:
          type: string
          enum: [jpeg, png, webp]
        width:
          type: integer
          description: Decoded image width in pixels.
        height:
          type: integer
          description: Decoded image height in pixels.
        size_bytes:
          type: integer
          format: int64
          description: Stored file size in bytes.
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    CreateProductRequest:
      type: object
      required: [name, price, currency]
      properties:
        category_id:
          type: string
          format: uuid
          description: Optional; must belong to the same merchant.
        name:
          type: string
          minLength: 1
          maxLength: 200
        sku:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 500
        price:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum: [IDR]
        image_url:
          type: string
          maxLength: 2048
          description: External HTTPS URL or backend-stored upload reference (/api/v1/product-images/...).
        active:
          type: boolean
          description: Defaults to true when omitted.
    UpdateProductRequest:
      type: object
      description: All fields optional; only provided fields change. PATCH cannot clear the image (nil means unchanged).
      properties:
        category_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        sku:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 500
        price:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum: [IDR]
        image_url:
          type: string
          maxLength: 2048
          description: External HTTPS URL or backend-stored upload reference (/api/v1/product-images/...).
        active:
          type: boolean
    CreatePaymentRequest:
      type: object
      required: [merchant_order_id, amount, currency, payment_method]
      properties:
        merchant_order_id:
          type: string
          minLength: 1
          maxLength: 100
          description: Merchant's unique order identifier
        amount:
          type: integer
          format: int64
          minimum: 1
          description: "Amount in smallest currency unit (IDR: rupiah)"
        currency:
          type: string
          enum: [IDR]
          description: Currency code (ISO 4217)
        payment_method:
          type: string
          enum: [QRIS]
          description: Payment method
    CreatePaymentResponse:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
          nullable: true
          description: Set for order-backed payments (transactions.order_id); absent for legacy payments
        merchant_order_id:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        payment_method:
          type: string
        provider:
          type: string
          description: Payment provider name
        provider_transaction_id:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        payment_url:
          type: string
          format: uri
          description: URL to redirect customer for payment
        expired_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    Payment:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
          nullable: true
          description: Set for order-backed payments; absent for legacy payments
        merchant_order_id:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        payment_method:
          type: string
        provider:
          type: string
          nullable: true
        provider_transaction_id:
          type: string
          nullable: true
        payment_url:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/PaymentStatus'
        expired_at:
          type: string
          format: date-time
          nullable: true
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        order_summary:
          $ref: '#/components/schemas/OrderSummary'
        order_items:
          type: array
          items:
            $ref: '#/components/schemas/DashboardPaymentOrderItem'
          description: |
            Immutable order-item snapshots for the dashboard payment detail
            response only (omitted on all other payment payloads, and for
            payments without a linked order or resolvable items). Product
            subtotal is the sum of item subtotals; it may differ from the
            authoritative payment amount, which must always be read from
            `amount`.
    DashboardPaymentOrderItem:
      type: object
      required: [product_name, unit_price, quantity, subtotal]
      description: |
        One purchased line as recorded at order creation time. Values are
        historical snapshots — never live catalog prices. All amounts are
        integer minor units; subtotal is the stored unit_price × quantity.
      properties:
        product_name:
          type: string
          description: Product name captured at order creation.
        unit_price:
          type: integer
          format: int64
          description: Product price at order creation in integer minor units.
        quantity:
          type: integer
          format: int64
        subtotal:
          type: integer
          format: int64
          description: Stored unit_price multiplied by quantity.
      example:
        product_name: Kopi Arabika
        unit_price: 35000
        quantity: 2
        subtotal: 70000
    OrderSummary:
      type: object
      nullable: true
      description: |
        Optional product makeup of the transaction's linked order, built from
        immutable order_items snapshots taken at purchase time (never the live
        catalog). Omitted for transactions without a linked order or without
        usable product names; clients must fall back to merchant_order_id.
      properties:
        product_names:
          type: array
          maxItems: 2
          items:
            type: string
          description: First product names in stable order-item order
        product_count:
          type: integer
          description: Number of distinct product lines with a usable name
      example:
        product_names: [Mechanical Keyboard, Mouse]
        product_count: 3
    PaymentStatus:
      type: string
      enum: [CREATED, PENDING, PAID, FAILED, EXPIRED, CANCELLED]
      description: |
        Payment lifecycle status.

        - CREATED: Transaction persisted, provider not yet called
        - PENDING: Provider accepted, awaiting customer payment
        - PAID: Customer payment confirmed (terminal)
        - FAILED: Payment failed (terminal)
        - EXPIRED: Payment expired (terminal)
        - CANCELLED: Payment cancelled (terminal)
    CreateRefundRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Refund amount in smallest currency unit
        currency:
          type: string
          enum: [IDR]
        reason:
          type: string
          maxLength: 500
          nullable: true
    Refund:
      type: object
      properties:
        refund_id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
        currency:
          type: string
        status:
          $ref: '#/components/schemas/RefundStatus'
        provider:
          type: string
        provider_refund_id:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        refunded_amount:
          type: integer
          format: int64
        reserved_amount:
          type: integer
          format: int64
        refundable_amount:
          type: integer
          format: int64
        transaction_amount:
          type: integer
          format: int64
        requested_at:
          type: string
          format: date-time
        succeeded_at:
          type: string
          format: date-time
          nullable: true
        failed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RefundStatus:
      type: string
      enum: [PENDING, PROCESSING, SUCCEEDED, FAILED]
      description: |
        Refund lifecycle status.

        - PENDING: Refund created, provider not yet called
        - PROCESSING: Provider processing
        - SUCCEEDED: Refund completed (terminal)
        - FAILED: Refund failed (terminal)
    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional expiration timestamp (must be in the future)
    CreateApiKeyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        name:
          type: string
        key_id:
          type: string
          description: Public key identifier (pk_...)
        secret:
          type: string
          description: Plaintext secret (sk_...) — returned ONCE only
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    RotateApiKeyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        name:
          type: string
        key_id:
          type: string
        secret:
          type: string
          description: New plaintext secret — returned ONCE only
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        name:
          type: string
        key_id:
          type: string
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpsertWebhookRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Webhook endpoint URL (HTTPS required in production)
        description:
          type: string
          maxLength: 100
          nullable: true
    WebhookConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        url:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookConfigWithSecret:
      allOf:
        - $ref: '#/components/schemas/WebhookConfig'
        - type: object
          properties:
            secret:
              type: string
              description: Plaintext signing secret — returned ONCE only
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        event_id:
          type: string
        event_type:
          type: string
        transaction_id:
          type: string
          format: uuid
        endpoint_url:
          type: string
        attempt_count:
          type: integer
        status:
          type: string
          enum: [PENDING, PROCESSING, DELIVERED, FAILED, DEAD]
        next_attempt_at:
          type: string
          format: date-time
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        last_http_status:
          type: integer
          nullable: true
        last_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookEventPayload:
      type: object
      description: Webhook event payload sent to merchant endpoint
      properties:
        id:
          type: string
          description: Event ID (evt_...)
        type:
          type: string
          enum:
            - payment.created
            - payment.pending
            - payment.paid
            - payment.failed
            - payment.expired
            - payment.cancelled
            - refund.created
            - refund.processing
            - refund.succeeded
            - refund.failed
        version:
          type: string
          example: "1"
        created_at:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/WebhookPaymentData'
    WebhookPaymentData:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
        merchant_order_id:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        payment_method:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        payment_url:
          type: string
          nullable: true
        provider_transaction_id:
          type: string
          nullable: true
        expired_at:
          type: string
          format: date-time
          nullable: true
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          nullable: true
          description: Field-level validation errors
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
    Meta:
      type: object
      properties:
        request_id:
          type: string
    RequestPasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    RequestPasswordResetResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: If an account exists for this email, a password-reset link has been sent.
    ConfirmPasswordResetRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 256
        password:
          type: string
          minLength: 8
          maxLength: 128
    ConfirmPasswordResetResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Your password has been reset. Sign in with your new password.
    DevRecoveryRequest:
      type: object
      required: [email, new_password, confirm_password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        new_password:
          type: string
          minLength: 8
          maxLength: 128
        confirm_password:
          type: string
          minLength: 8
          maxLength: 128
    DevRecoveryResponse:
      type: object
      required: [message, email]
      properties:
        message:
          type: string
          example: Password has been reset. Sign in with your new password.
        email:
          type: string
          format: email
    DevRecoveryStatusResponse:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          example: false
    ListMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
              format: int64
            total_pages:
              type: integer
  responses:
    OrderCreatedResponse:
      description: New order created; no payment was created
      content:
        application/json:
          schema:
            type: object
            required: [success, data, meta]
            properties:
              success:
                type: boolean
                const: true
              data:
                $ref: '#/components/schemas/Order'
              meta:
                $ref: '#/components/schemas/Meta'
    OrderReplayedResponse:
      description: Existing order replayed for an equivalent request with the same merchant/key; prices are the original snapshots
      content:
        application/json:
          schema:
            type: object
            required: [success, data, meta]
            properties:
              success:
                type: boolean
                const: true
              data:
                $ref: '#/components/schemas/Order'
              meta:
