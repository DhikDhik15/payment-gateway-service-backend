input {
  file {
    path => "/var/lib/docker/containers/*/*-json.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
  }
}

filter {
  json {
    source => "log"
    target => "app_log"
  }

  # The file input tails every container log on the host. Only the Go
  # application emits {"time":...} records; drop anything else (other
  # containers' logs, Logstash's own output) so the payment-gateway index
  # keeps its original semantics.
  if ![app_log][time] {
    drop { }
  }

  date {
    match => [ "[app_log][time]", "ISO8601" ]
    target => "@timestamp"
  }

  mutate {
    add_field => {
      "service" => "payment-gateway"
      "container" => "pay-gate-app"
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    index => "payment-gateway-logs-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca.crt"
    ssl_verification_mode => "full"
  }
}